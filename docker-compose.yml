services:
  backend:
    build:
      context: ./backend
    container_name: authnest-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL to the public backend API URL before building}
    container_name: authnest-frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
